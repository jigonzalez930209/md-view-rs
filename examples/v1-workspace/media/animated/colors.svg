<svg xmlns="http://www.w3.org/2000/svg" width="240" height="150" viewBox="0 0 240 150">
  <!-- SMIL: colors in names, #rgb and rgb(); discrete steps; a <set> after 1 s; geometry. -->
  <rect width="240" height="150" fill="black">
    <animate attributeName="fill" values="black;navy;#036;rgb(0, 80, 40);black" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="20" y="20" width="60" height="60" rx="4" fill="red">
    <animate attributeName="fill" values="red;orange;gold;lime;cyan;magenta" dur="3s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <rect x="100" y="20" width="10" height="60" fill="#fff">
    <animate attributeName="width" values="10;120;10" dur="2s" repeatCount="indefinite"/>
  </rect>
  <circle cx="60" cy="115" r="12" fill="gray">
    <set attributeName="fill" to="#2da44e" begin="1s"/>
    <animate attributeName="r" values="12;24;12" dur="1s" repeatCount="indefinite"/>
  </circle>
</svg>
