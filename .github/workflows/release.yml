name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v1.0.0-rc.0

permissions:
  contents: write

env:
  VERSION: 1.0.0-rc.0
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev libxi-dev \
            libgl1-mesa-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            rpm
      - name: Install appimagetool
        run: |
          curl -L --fail --silent --show-error \
            -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool
      - name: Build packages
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          MDVIEW_UPDATE_BASE_URL: https://github.com/jigonzalez930209/md-view-rs/releases/download/${{ env.TAG }}
        run: |
          cargo xtask package
          cargo xtask release-check
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/SHA256SUMS
            dist/latest.json
            dist/sbom.cdx.json

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Build application and icons
        run: |
          cargo build --release --locked -p mdview-app
          cargo xtask icons
      - name: Package unsigned app
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          APP="dist/MD View.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/release/mdview "$APP/Contents/MacOS/mdview"
          cp packaging/macos/Info.plist "$APP/Contents/Info.plist"
          cp assets/icons/mdview.icns "$APP/Contents/Resources/mdview.icns"
          plutil -replace CFBundleShortVersionString -string "1.0.0" "$APP/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "1.0.0" "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP" || true
          hdiutil create -volname "MD View" -srcfolder "$APP" -ov -format UDZO \
            "dist/MD-View-${VERSION}-macOS-arm64.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$APP" \
            "dist/MD-View-${VERSION}-macOS-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*macOS-arm64.dmg
            dist/*macOS-arm64.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Build application and icons
        run: |
          cargo build --release --locked -p mdview-app
          cargo xtask icons
      - name: Package portable zip and MSI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/mdview.exe,README.md,LICENSE-MIT,LICENSE-APACHE `
            -DestinationPath "dist/MD-View-$env:VERSION-windows-x86_64.zip" -Force
          dotnet tool install --global wix --version 4.*
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          wix build packaging/windows/mdview.wxs `
            -o "dist/MD-View-$env:VERSION-windows-x86_64.msi"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*windows-x86_64.zip
            dist/*windows-x86_64.msi

  publish:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Assemble checksums and update manifest
        env:
          VERSION: ${{ env.VERSION }}
          TAG: ${{ env.TAG }}
        run: |
          cd release-assets
          rm -f SHA256SUMS latest.json
          sha256sum * | sort > SHA256SUMS
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('.')
          version = os.environ['VERSION']
          tag = os.environ['TAG']
          base = f'https://github.com/jigonzalez930209/md-view-rs/releases/download/{tag}'
          assets = []
          for path in sorted(root.iterdir()):
              if path.is_file() and path.name not in {'SHA256SUMS', 'latest.json'}:
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  assets.append({
                      'name': path.name,
                      'url': f'{base}/{path.name}',
                      'sha256': digest,
                      'size': path.stat().st_size,
                  })
          document = {
              'version': version,
              'channel': 'stable',
              'notes': 'See CHANGELOG.md',
              'assets': assets,
          }
          Path('latest.json').write_text(json.dumps(document, indent=2) + '\n')
          PY
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ env.VERSION }}
          TAG: ${{ env.TAG }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "MD View ${VERSION}" \
              --notes-file ".github/release-notes/${TAG}.md" --prerelease
          else
            gh release create "$TAG" --title "MD View ${VERSION}" \
              --notes-file ".github/release-notes/${TAG}.md" --prerelease
          fi
          gh release upload "$TAG" release-assets/* --clobber
