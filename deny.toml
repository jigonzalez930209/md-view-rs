# Dependency policy for MD View.
#
# The application is distributed under MIT OR Apache-2.0. Third-party crates must
# use a permissive license that is compatible with that choice. Advisory
# exceptions are limited to unmaintained transitive crates that have no safe
# replacement in the pinned dependency graph; each exception names the owner and
# the reason.

[graph]
all-features = true

[advisories]
version = 2
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode 1 is pulled in by a pinned font/theme tool; no runtime deserialization of untrusted data." },
    { id = "RUSTSEC-2024-0320", reason = "yaml-rust is pulled in by syntect's YAML theme loader; themes are embedded and trusted." },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is pulled in by the text stack; font files are embedded and bounded." },
]

[licenses]
version = 2
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/storytold/craft-libs",
    "https://github.com/storytold/egui",
    "https://github.com/storytold/vectorcraft",
    "https://github.com/storytold/winit",
]
